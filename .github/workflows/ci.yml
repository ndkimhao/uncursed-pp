name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in mise.toml (python, uv, make) with caching.
      - uses: jdx/mise-action@v2

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Typecheck (mypy --strict) and full test suite
        run: make check

      # The standalone checker through the real CLI entry point - same
      # specs as the suite, but exercises uncursed-pp-check itself.
      - name: Spec-check every template via uncursed-pp-check
        run: make speccheck
