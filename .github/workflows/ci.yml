name: CI

on:
  push:
  pull_request:

jobs:
  # mypy --strict + the full pytest suite (unit, golden, cc -E e2e specs)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in mise.toml (python, uv, make) with caching.
      - uses: jdx/mise-action@v4

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Typecheck (mypy --strict) and full test suite
        run: make check

  # The standalone checker through the real CLI entry point - same specs
  # as the suite, but exercises uncursed-pp-check itself.
  speccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Spec-check every template via uncursed-pp-check
        run: make speccheck

  # uncursed-pp-eval end to end: invoke mode and --update-specs mode,
  # each with and without --format.
  eval-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # clang-format comes from the dev dependency group (PyPI wheel),
      # installed and cached by the same `uv sync` as everything else.
      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Smoke uncursed-pp-eval (invoke / update-specs, +/- format)
        run: make eval-smoke

  # After the main jobs pass: spec-check through the latest release of
  # every supported gcc (12-16) and clang (19-22) major. One serial job
  # so the compilers install once, with the .debs cached across runs.
  compiler-matrix:
    runs-on: ubuntu-latest
    needs: [check, speccheck, eval-cli]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      # gcc 12-14 ship in noble; 15/16 come from the toolchain PPA and
      # clang 19-22 from apt.llvm.org.
      - name: Add compiler apt sources
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt-llvm-org.asc > /dev/null
          for v in 19 20 21 22; do
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$v main" \
              | sudo tee -a /etc/apt/sources.list.d/llvm.list > /dev/null
          done
          sudo apt-get update

      - name: Install compilers (cached .debs)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gcc-12 gcc-13 gcc-14 gcc-15 gcc-16 clang-19 clang-20 clang-21 clang-22
          version: 1.0

      - name: Spec-check every template with every compiler (nproc-parallel)
        run: |
          set -eu
          ccs="gcc-12 gcc-13 gcc-14 gcc-15 gcc-16 clang-19 clang-20 clang-21 clang-22"
          # parallel across compilers, one log per compiler so the
          # grouped output below stays readable; xargs keeps running the
          # remaining compilers when one fails and exits nonzero at the end
          failed=0
          printf '%s\n' $ccs | xargs -P "$(nproc)" -I{} sh -c \
            'make speccheck CHECK_CC={} > /tmp/speccheck-{}.log 2>&1' || failed=1
          for cc in $ccs; do
            echo "::group::${cc} ($($cc --version | head -1))"
            cat "/tmp/speccheck-$cc.log"
            echo "::endgroup::"
          done
          exit "$failed"
