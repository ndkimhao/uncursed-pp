name: CI

on:
  push:
  pull_request:

jobs:
  # mypy --strict + the full pytest suite (unit, golden, cc -E e2e specs)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in mise.toml (python, uv, make) with caching.
      - uses: jdx/mise-action@v4

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Typecheck (mypy --strict) and full test suite
        run: make check

  # The standalone checker through the real CLI entry point - same specs
  # as the suite, but exercises uncursed-pp-check itself.
  speccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Spec-check every template via uncursed-pp-check
        run: make speccheck

  # uncursed-pp-eval end to end: invoke mode and --update-specs mode,
  # each with and without --format.
  eval-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # clang-format comes from the dev dependency group (PyPI wheel),
      # installed and cached by the same `uv sync` as everything else.
      - name: Set up environment (uv sync + vendored Boost.PP)
        run: make setup

      - name: Smoke uncursed-pp-eval (invoke / update-specs, +/- format)
        run: make eval-smoke
