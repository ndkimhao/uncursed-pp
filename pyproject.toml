[project]
name = "uncursed-pp"
version = "0.1.0"
description = "A readable template DSL compiled to Boost.Preprocessor C macros"
requires-python = ">=3.12"
dependencies = ["lark>=1.2"]

[project.scripts]
uncursed-pp = "uncursed_pp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncursed_pp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/uncursed_pp", "tests"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# tests are exercised code, not an API surface: keep them type-CHECKED
# but don't demand annotations on every test function
module = ["conftest", "test_cli", "test_collapse", "test_conditionals", "test_config", "test_defaults", "test_e2e_specs", "test_expressions", "test_golden", "test_harness", "test_loops", "test_named_args", "test_syntax", "test_variadic"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
disallow_untyped_calls = false
allow_untyped_globals = true
