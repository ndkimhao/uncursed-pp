[project]
name = "cursedpp"
version = "0.1.0"
description = "A readable template DSL compiled to Boost.Preprocessor C macros"
requires-python = ">=3.12"
dependencies = ["lark>=1.2"]

[project.scripts]
cursedpp = "cursedpp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cursedpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/cursedpp"]
python_version = "3.12"
strict = true
